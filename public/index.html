<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi WhatsApp Web</title>
  <style>
    :root {
      --bg-color: #111b21;
      --header-bg: #202c33;
      --border-color: #222d34;
      --text-color: #e9edef;
      --button-bg: #00a884;
      --button-text: #ffffff;
      --card-bg: #111b21;
    }

    [data-theme="light"] {
      --bg-color: #f0f2f5;
      --header-bg: #ffffff;
      --border-color: #e9edef;
      --text-color: #111b21;
      --button-bg: #008069;
      --button-text: #ffffff;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    .top-bar {
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-bar h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .btn {
      background-color: var(--button-bg);
      color: var(--button-text);
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .container {
      flex: 1;
      display: flex;
      width: 100%;
      height: calc(100vh - 55px);
    }

    .painel {
      flex: 1;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      background-color: var(--card-bg);
    }

    .painel:last-child {
      border-right: none;
    }

    .painel-header {
      background-color: var(--header-bg);
      padding: 10px;
      font-weight: bold;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-reload {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <h1>Painel Multi-WhatsApp</h1>
    <button class="btn" id="theme-toggle">☀️ Modo Claro</button>
  </header>

  <main class="container">

    <section class="painel">
      <div class="painel-header">
        <span>WhatsApp 1</span>
        <button class="btn-reload" onclick="reloadFrame('frame1')">🔄 Recarregar</button>
      </div>
      <iframe id="frame1" src="/wa-proxy"></iframe>
    </section>

    <section class="painel">
      <div class="painel-header">
        <span>WhatsApp 2</span>
        <button class="btn-reload" onclick="reloadFrame('frame2')">🔄 Recarregar</button>
      </div>
      <iframe id="frame2" src="/wa-proxy"></iframe>
    </section>

    <section class="painel">
      <div class="painel-header">
        <span>WhatsApp 3</span>
        <button class="btn-reload" onclick="reloadFrame('frame3')">🔄 Recarregar</button>
      </div>
      <iframe id="frame3" src="/wa-proxy"></iframe>
    </section>

  </main>

  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      if (currentTheme === 'light') {
        document.documentElement.removeAttribute('data-theme');
        themeToggleBtn.textContent = '☀️ Modo Claro';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        themeToggleBtn.textContent = '🌙 Modo Escuro';
      }
    });

    function reloadFrame(id) {
      const iframe = document.getElementById(id);
      if (iframe) iframe.src = iframe.src;
    }
  </script>
</body>
</html>
